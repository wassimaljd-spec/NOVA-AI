<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h2>✦ Nova</h2></header>
  <main id="chatFeed" class="chat-feed">
    <div class="message nova">
      <div class="name">Nova</div>
      <div class="bubble">Yo 👋 I'm Nova. What can I help you with?</div>
    </div>
  </main>
  <form id="chatForm" class="composer">
    <textarea id="messageInput" placeholder="Message Nova..." rows="1"></textarea>
    <button type="submit">➤</button>
  </form>
  <script src="script.js"></script>
</body>
</html>
